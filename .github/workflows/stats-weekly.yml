name: Update heavy org stats (weekly)

on:
  schedule:
    - cron: '13 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heavy-stats:
    # RUNNER BACKEND IS A REPO VARIABLE (2026-10-25, runner-cost plan). With CI_RUNNER_BACKEND == 'runs-on' this job runs on an ephemeral
    # AWS spot runner (RunsOn, account secondarydao-ci); unset or anything else, it runs on GitHub-hosted ubuntu-latest. Rollback is
    # deleting the variable. The label is unique per run/attempt/job/matrix leg so concurrent jobs never share an instance. Job names are unchanged.
    runs-on: "${{ vars.CI_RUNNER_BACKEND == 'runs-on' && format('runs-on={0}-{1}-heavy-stats-{2}/runner=2cpu-linux-x64', github.run_id, github.run_attempt, strategy.job-index) || 'ubuntu-latest' }}"
    env:
      PUBLISH_REPOS: >-
        SDRealEstateTokenization
        SDBackendAPI
        SDNextJSfrontend
        SDAdminDashBoard
        SDExplorer
        SDMobile
        SD.com-nextJS-Front-Website
        SD
        api-docs
    steps:
      - name: Mint a short-lived read-only token (GitHub App secondarydao-org-stats)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.STATS_APP_ID }}
          private-key: ${{ secrets.STATS_APP_PRIVATE_KEY }}
          owner: SecondaryDAO
          # scope = PUBLISH_REPOS below; a repo missing here fails the run at clone time
          repositories: |
            SDRealEstateTokenization
            SDBackendAPI
            SDNextJSfrontend
            SDAdminDashBoard
            SDExplorer
            SDMobile
            SD.com-nextJS-Front-Website
            SD
            api-docs
          permission-contents: read
          permission-metadata: read

      - uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc jq

      - name: Aggregate LOC + languages + weekly commits
        shell: bash -eo pipefail {0}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          mkdir -p profile/stats

          SINCE=$(date -u -d '7 days ago' +'%Y-%m-%dT%H:%M:%SZ')
          TOTAL_LOC=0
          TOTAL_WEEKLY=0
          : > /tmp/langs.tsv

          for name in $PUBLISH_REPOS; do
            echo "=== $name ==="
            tmpdir=$(mktemp -d)

            # token goes in via env (not argv, not the URL), so it never shows in the process table or a remote URL
            if ! GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
                 GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
                 git clone --quiet --depth 50 "https://github.com/SecondaryDAO/${name}.git" "$tmpdir"; then
              echo "::error::clone failed for $name (expired/revoked app key, or app lost access?). Refusing to publish partial stats."
              exit 1
            fi

            loc=$(cloc --quiet --json \
              --exclude-dir=node_modules,dist,build,.next,out,coverage,deployments,artifacts,cache,__pycache__,venv,vendor,locales \
              --exclude-ext=json,lock,svg,png,jpg,jpeg,gif,ico,pdf,csv \
              "$tmpdir" | jq -r '.SUM.code // 0') \
              || { echo "::error::cloc/jq failed for $name"; exit 1; }
            # zero is not proof: every published repo has code, so empty/0/non-numeric means the measurement failed
            if ! [[ "$loc" =~ ^[0-9]+$ ]] || [ "$loc" -eq 0 ]; then
              echo "::error::LOC for $name is '${loc}' (expected > 0). Refusing to publish."
              exit 1
            fi
            TOTAL_LOC=$(( TOTAL_LOC + loc ))
            echo "$name LOC: $loc"

            langs_json=$(gh api "/repos/SecondaryDAO/${name}/languages") \
              || { echo "::error::languages API call failed for $name"; exit 1; }
            # every published repo has code: an empty or malformed languages response is a failed measurement
            echo "$langs_json" | jq -e 'type=="object" and length>0 and all(.[]; type=="number" and . >= 0 and . == floor)' >/dev/null \
              || { echo "::error::languages response for $name is empty or malformed"; exit 1; }
            echo "$langs_json" | jq -r 'to_entries[] | "\(.key)\t\(.value)"' >> /tmp/langs.tsv \
              || { echo "::error::could not parse languages for $name"; exit 1; }

            weekly=$(gh api graphql -f query="
              query {
                repository(owner: \"SecondaryDAO\", name: \"${name}\") {
                  defaultBranchRef {
                    target {
                      ... on Commit {
                        history(since: \"${SINCE}\") { totalCount }
                      }
                    }
                  }
                }
              }" --jq '.data.repository.defaultBranchRef.target.history.totalCount | if type == "number" and . >= 0 then . else error("missing totalCount") end') \
              || { echo "::error::weekly-commit query failed for $name"; exit 1; }
            # 0 commits in a week is legitimate; empty or non-numeric is a failed query
            [[ "$weekly" =~ ^[0-9]+$ ]] || { echo "::error::weekly commits for $name is '${weekly}'"; exit 1; }
            TOTAL_WEEKLY=$(( TOTAL_WEEKLY + weekly ))
            echo "$name weekly commits: $weekly"

            rm -rf "$tmpdir"
          done

          format_num() {
            local n="$1"
            if [ -n "$n" ] && [ "$n" -ge 1000 ]; then
              LC_ALL=en_US.UTF-8 printf "%'d" "$n" 2>/dev/null || printf "%s" "$n"
            else
              printf "%s" "$n"
            fi
          }

          loc_fmt=$(format_num "$TOTAL_LOC")
          weekly_fmt=$(format_num "$TOTAL_WEEKLY")

          cat > profile/stats/TOTAL-loc.json <<EOF
          {"schemaVersion":1,"label":"lines of code","message":"${loc_fmt}","color":"1f6feb"}
          EOF
          cat > profile/stats/TOTAL-weekly-commits.json <<EOF
          {"schemaVersion":1,"label":"commits last 7d","message":"${weekly_fmt}","color":"brightgreen"}
          EOF

          python3 - > /tmp/languages.svg <<'PY'
          import sys, html
          rows = {}
          with open("/tmp/langs.tsv") as f:
              for line in f:
                  lang, raw = line.rstrip("\n").split("\t")
                  if int(raw) < 0:
                      sys.exit(f"negative byte count for {lang}")
                  rows[lang] = rows.get(lang, 0) + int(raw)

          total = sum(rows.values())
          if total <= 0:
              sys.exit("no language bytes collected; refusing to write languages.svg")
          colors = {
              "JavaScript": "#f1e05a", "TypeScript": "#3178c6", "Solidity": "#AA6746",
              "Python": "#3572A5", "HTML": "#e34c26", "CSS": "#663399",
              "SCSS": "#c6538c", "Shell": "#89e051", "Ruby": "#701516",
              "Go": "#00ADD8", "Rust": "#dea584", "Java": "#b07219",
              "Kotlin": "#A97BFF", "Swift": "#F05138", "Dart": "#00B4AB",
              "C": "#555555", "C++": "#f34b7d", "PHP": "#4F5D95",
              "Dockerfile": "#384d54", "Markdown": "#083fa1",
          }
          fallback = ["#6e7681", "#8957e5", "#db61a2", "#f85149", "#ffa657", "#bf8700"]

          sorted_rows = sorted(rows.items(), key=lambda kv: kv[1], reverse=True)
          top = sorted_rows[:6]
          other = sum(b for _, b in sorted_rows[6:])
          if other > 0:
              top.append(("Other", other))

          width = 720
          bar_h = 14
          legend_y = bar_h + 10

          fb_i = 0
          segments = []
          for name, b in top:
              pct = 100.0 * b / total if total else 0
              w = width * pct / 100.0
              col = colors.get(name)
              if not col:
                  col = fallback[fb_i % len(fallback)]; fb_i += 1
              segments.append((col, name, pct, w))

          out = [f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="30" viewBox="0 0 {width} 30" role="img" aria-label="Language breakdown">']
          out.append(f'<clipPath id="r"><rect x="0" y="0" width="{width}" height="{bar_h}" rx="3"/></clipPath>')
          out.append(f'<rect x="0" y="0" width="{width}" height="{bar_h}" rx="3" fill="#2d333b"/>')
          out.append('<g clip-path="url(#r)">')
          x = 0.0
          for col, name, pct, w in segments:
              out.append(f'<rect x="{x:.2f}" y="0" width="{w:.2f}" height="{bar_h}" fill="{col}"><title>{html.escape(name)} {pct:.1f}%</title></rect>')
              x += w
          out.append('</g>')
          font = 'font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10"'
          lx = 0
          for col, name, pct, _ in segments:
              out.append(f'<circle cx="{lx+5}" cy="{legend_y+3}" r="4" fill="{col}"/>')
              label = f"{html.escape(name)} {pct:.1f}%"
              out.append(f'<text x="{lx+13}" y="{legend_y+6}" fill="#c9d1d9" {font}>{label}</text>')
              lx += 13 + 7 * len(name) + 8 + 30
          out.append('</svg>')
          sys.stdout.write("".join(out))
          PY
          head -c 4 /tmp/languages.svg | grep -q '^<svg' && tail -c 6 /tmp/languages.svg | grep -q '</svg>' \
            || { echo "::error::languages.svg is not a complete SVG; refusing to publish"; exit 1; }
          mv /tmp/languages.svg profile/stats/languages.svg

          echo "Totals: LOC ${loc_fmt}, weekly commits ${weekly_fmt}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats
          if git diff --cached --quiet; then
            echo "No heavy stat changes this run."
            exit 0
          fi
          git commit -m "chore: refresh heavy org stats (weekly)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejected, rebasing (attempt $i/5)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "Failed to push after 5 attempts"; exit 1
