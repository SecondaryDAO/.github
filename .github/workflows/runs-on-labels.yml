name: RunsOn labels

# Fails when a RunsOn job label could be shared by two concurrent executions, or is not the one supported selector expression.
# Its own workflow so it adds no step to any existing job.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-runs-on-labels.py'
      - 'scripts/test_check_runs_on_labels.py'

permissions:
  contents: read

concurrency:
  group: runs-on-labels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labels:
    # RUNNER BACKEND IS A REPO VARIABLE (2026-10-25, runner-cost plan). With CI_RUNNER_BACKEND == 'runs-on' this job runs on an ephemeral
    # AWS spot runner (RunsOn, account secondarydao-ci); unset or anything else, it runs on GitHub-hosted ubuntu-latest. Rollback is
    # deleting the variable. The label is unique per run/attempt/job/matrix leg so concurrent jobs never share an instance. Job names are unchanged.
    runs-on: "${{ vars.CI_RUNNER_BACKEND == 'runs-on' && format('runs-on={0}-{1}-labels-{2}/runner=2cpu-linux-x64', github.run_id, github.run_attempt, strategy.job-index) || 'ubuntu-latest' }}"
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check RunsOn labels and run the label-check controls
        run: |
          python3 scripts/check-runs-on-labels.py
          python3 scripts/test_check_runs_on_labels.py
